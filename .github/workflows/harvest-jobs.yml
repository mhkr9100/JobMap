name: Harvest jobs

on:
  schedule:
    # Runs at minute 17 of every hour
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      location:
        description: "Target Metro (leave empty for automatic US hourly rotation)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: harvest-jobs
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install harvester dependencies
        run: python -m pip install -r requirements.txt

      - name: Harvest and upsert jobs
        run: python src/scripts/harvest_jobs.py
        env:
          HARVEST_LOCATION: ${{ github.event.inputs.location }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
